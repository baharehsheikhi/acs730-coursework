name: lab4-ci
 
on:
  push:
    branches: [main, lab4-pipeline]
  pull_request:
 
permissions:
  contents: read
 
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false        # one red cell must not cancel the others
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/python-deps
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r lab4/requirements.txt -r lab4/requirements-dev.txt
      - working-directory: lab4
        run: python -m pytest
  image:
    needs: test
    uses: ./.github/workflows/docker-build.yml
    with:
      context: lab4
      image-name: acs730-lab4
      push: ${{ github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
      packages: write

  report:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - run: echo "built ${{ needs.image.outputs.image-ref }}"

    summary:
    needs: [test, image, report]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: echo "test ${{ needs.test.result }} image ${{ needs.image.result }} report ${{ needs.report.result }} ref ${{ needs.image.outputs.image-ref }}" >> "$GITHUB_STEP_SUMMARY"
      - name: Re-raise an upstream failure
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
