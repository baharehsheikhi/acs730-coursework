---
- name: Install required packages
  ansible.builtin.dnf:
    name:
      - python3
    state: present

- name: Create application user
  ansible.builtin.user:
    name: "{{ app_user }}"
    system: true
    shell: /sbin/nologin
    create_home: false
    state: present

- name: Create application directory
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0755"

- name: Install website template
  ansible.builtin.template:
    src: index.html.j2
    dest: "{{ app_dir }}/index.html"
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0644"
  notify: Restart acs730-web

- name: Install systemd service
  ansible.builtin.template:
    src: acs730-web.service.j2
    dest: /etc/systemd/system/acs730-web.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart acs730-web

- name: Enable and start the web service
  ansible.builtin.systemd:
    name: acs730-web
    enabled: true
    state: started
    daemon_reload: true
